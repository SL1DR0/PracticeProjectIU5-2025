<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Booking Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .section { margin-bottom: 30px; }
        #flightsList, #bookingDetails { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Flight Booking Application</h1>

        <!-- Registration Section -->
        <div class="section">
            <h2>Register</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" id="regLogin" placeholder="Login">
                </div>
                <div class="col-md-4">
                    <input type="password" class="form-control" id="regPassword" placeholder="Password">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100" onclick="register()">Register</button>
                </div>
            </div>
        </div>

        <!-- Login Section -->
        <div class="section">
            <h2>Login</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" id="loginLogin" placeholder="Login">
                </div>
                <div class="col-md-4">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Password">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100" onclick="login()">Login</button>
                </div>
            </div>
        </div>

        <!-- Flights Section -->
        <div class="section">
            <h2>Available Flights</h2>
            <button class="btn btn-info mb-3" onclick="loadFlights()">Refresh Flights</button>
            <ul class="list-group" id="flightsList"></ul>
        </div>

        <!-- Booking Section -->
        <div class="section">
            <h2>Book a Flight</h2>
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="flightNumber" placeholder="Flight Number">
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" id="passengerName" placeholder="Passenger Name">
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control" id="passportNumber" placeholder="Passport Number">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-success w-100" onclick="makeBooking()">Book</button>
                </div>
            </div>
        </div>

        <!-- Booking Management Section -->
        <div class="section">
            <h2>Manage Booking</h2>
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" class="form-control" id="bookingId" placeholder="Enter Booking ID">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-info w-100" onclick="viewBooking()">View</button>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-danger w-100" onclick="cancelBooking()">Cancel</button>
                </div>
            </div>
            <div id="bookingDetails"></div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8080';

        async function register() {
            const login = document.getElementById('regLogin').value;
            const password = document.getElementById('regPassword').value;
            try {
                const response = await fetch(`${BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert('Error during registration');
            }
        }

        async function login() {
            const login = document.getElementById('loginLogin').value;
            const password = document.getElementById('loginPassword').value;
            try {
                const response = await fetch(`${BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert('Error during login');
            }
        }

        async function loadFlights() {
            try {
                const response = await fetch(`${BASE_URL}/flights`);
                const flights = await response.json();
                const list = document.getElementById('flightsList');
                list.innerHTML = '';
                flights.forEach(flight => {
                    const item = document.createElement('li');
                    item.className = 'list-group-item';
                    item.textContent = `${flight.flightNumber} - ${flight.departure} to ${flight.destination} on ${flight.date} (Seats: ${flight.availableSeats})`;
                    list.appendChild(item);
                });
            } catch (error) {
                alert('Error loading flights');
            }
        }

        async function makeBooking() {
            const flightNumber = document.getElementById('flightNumber').value;
            const passengerName = document.getElementById('passengerName').value;
            const passportNumber = document.getElementById('passportNumber').value;
            try {
                const response = await fetch(`${BASE_URL}/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ flightNumber, passengerName, passportNumber })
                });
                const data = await response.json();
                alert(data.message);
                if (data.bookingId) alert(`Booking ID: ${data.bookingId}`);
            } catch (error) {
                alert('Error making booking');
            }
        }

        async function viewBooking() {
            const bookingId = document.getElementById('bookingId').value;
            try {
                const response = await fetch(`${BASE_URL}/bookings/${bookingId}`);
                const data = await response.json();
                const details = document.getElementById('bookingDetails');
                if (data.bookingId) {
                    details.innerHTML = `
                        <div class="card mt-3">
                            <div class="card-body">
                                <p><strong>Booking ID:</strong> ${data.bookingId}</p>
                                <p><strong>Flight Number:</strong> ${data.flightNumber}</p>
                                <p><strong>Passenger Name:</strong> ${data.passengerName}</p>
                                <p><strong>Passport Number:</strong> ${data.passportNumber}</p>
                                <p><strong>Booking Date:</strong> ${data.bookingDate}</p>
                                <p><strong>Status:</strong> ${data.status}</p>
                            </div>
                        </div>
                    `;
                } else {
                    details.innerHTML = `<p class="text-danger mt-3">${data}</p>`;
                }
            } catch (error) {
                alert('Error viewing booking');
            }
        }

        async function cancelBooking() {
            const bookingId = document.getElementById('bookingId').value;
            try {
                const response = await fetch(`${BASE_URL}/bookings/${bookingId}/cancel`, {
                    method: 'POST'
                });
                const data = await response.json();
                alert(data.message);
                viewBooking();
            } catch (error) {
                alert('Error canceling booking');
            }
        }

        // Load flights on page loadd
        window.onload = loadFlights;
    </script>
</body>
</html>
